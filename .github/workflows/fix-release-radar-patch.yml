name: Fix temporary Release Radar patch

on:
  push:
    paths:
      - '.github/workflows/fix-release-radar-patch.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix patch markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/release-radar-patch.yml')
          s=p.read_text(encoding='utf-8')
          old1="""}\n\n/* ---------- update channel ----------''',\n              'adoption chart')"""
          new1="""}\n\n''',\n              'adoption chart')"""
          old2="""}\nfunction renderAssetCard''',\n              'release table')"""
          new2="""}\n''',\n              'release table')"""
          for old,new,label in [(old1,new1,'adoption end marker'),(old2,new2,'table end marker')]:
              n=s.count(old)
              if n!=1: raise RuntimeError(f'{label}: expected 1 match, found {n}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release-radar-patch.yml
          git commit -m 'Fix temporary Release Radar patch markers'
          git push origin HEAD:main
